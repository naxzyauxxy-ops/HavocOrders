# =====================================================
#              DonutOrders - config.yml
# =====================================================
# NOTE: never paste this file publicly with real credentials in it.

DEBUG: false

DATABASE:
  TYPE: "SQLITE" # SQLITE or MYSQL
  MYSQL:
    HOST: "127.0.0.1"
    PORT: 3306
    DATABASE: "donutorders"
    USER: "CHANGE_ME"
    PASSWORD: "CHANGE_ME"
    USE-SSL: false

SETTINGS:
  MIN-PRICE-AMOUNT: 1.0
  MAX-PRICE-AMOUNT: 1000000.0
  MIN-ITEM-AMOUNT: 1
  MAX-ITEM-AMOUNT: 3456
  MAX-ORDERS-PER-PLAYER: 10
  EXPIRE-DAYS: 7
  # Charge the full order value up front and hold it in escrow.
  # Deliverers are paid out of that escrow; unspent escrow is refunded on cancel/expiry.
  ESCROW: true
  CURRENCY-SYMBOL: "$"
  SAVE-INTERVAL-SECONDS: 300
  EXPIRY-CHECK-SECONDS: 60

# Prices used by the "Sell All" button in the Collect Items menu.
SELL:
  ENABLED: true
  # Fallback price per item when the material has no entry below. 0 = not sellable.
  DEFAULT-PRICE: 0.0
  # Multiplier applied on top of the resolved price.
  MULTIPLIER: 1.0
  PRICES:
    DIAMOND: 100.0
    NETHERITE_INGOT: 1000.0
    EMERALD: 40.0
    GOLD_INGOT: 25.0
    IRON_INGOT: 15.0
    COPPER_INGOT: 5.0
    LAPIS_LAZULI: 8.0
    REDSTONE: 5.0
    COAL: 3.0
    ANCIENT_DEBRIS: 500.0
    ENCHANTED_GOLDEN_APPLE: 750.0
    GOLDEN_APPLE: 80.0
    TOTEM_OF_UNDYING: 400.0
    ELYTRA: 1200.0
    NETHER_STAR: 2000.0
    SHULKER_SHELL: 150.0

ITEM-RESTRICTIONS:
  BLOCKED-ITEMS:
    - "COMMAND_BLOCK"
    - "CHAIN_COMMAND_BLOCK"
    - "REPEATING_COMMAND_BLOCK"
    - "COMMAND_BLOCK_MINECART"
    - "STRUCTURE_BLOCK"
    - "STRUCTURE_VOID"
    - "JIGSAW"
    - "BARRIER"
    - "LIGHT"
    - "BEDROCK"
    - "END_PORTAL_FRAME"
    - "SPAWNER"
    - "DEBUG_STICK"
    - "KNOWLEDGE_BOOK"

